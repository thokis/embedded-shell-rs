[package]
name = "eshell"
version = "0.1.0"
description = "Command-line driver for embedded-shell-rs — exec, push, pull, info, ping, reboot over a serial line."
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "eshell"
path = "src/main.rs"

[dependencies]
embedded-shell = { path = "../embedded-shell" }
embedded-shell-linux = { path = "../embedded-shell-linux" }
embedded-shell-transfer = { path = "../embedded-shell-transfer", features = ["http", "serial"] }

anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true }
tracing.workspace = true
tracing-subscriber.workspace = true
