[package]
name = "embedded-shell-cli"
version = "0.1.0"
description = "Command-line driver for embedded-shell-rs — exec, push, pull, info, ping, reboot, service, journal, modem, network, services over a serial line. Ships the `eshell` binary."
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Crate name is `embedded-shell-cli` (consistent with the rest of the
# workspace), but the produced binary is `eshell` — short and easy to
# type for daily use.
[[bin]]
name = "eshell"
path = "src/main.rs"

[dependencies]
embedded-shell = { path = "../embedded-shell" }
embedded-shell-linux = { path = "../embedded-shell-linux", features = ["systemd", "modemmanager", "iproute2", "networkmanager"] }
embedded-shell-transfer = { path = "../embedded-shell-transfer", features = ["http", "serial"] }

anyhow.workspace = true
clap.workspace = true
clap_complete = "4"
rustyline = { version = "18", default-features = false, features = ["with-file-history"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true }
tracing.workspace = true
tracing-subscriber.workspace = true
