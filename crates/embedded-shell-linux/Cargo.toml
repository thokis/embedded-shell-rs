[package]
name = "embedded-shell-linux"
version = "0.1.0"
description = "Thin async wrappers around common Linux userland CLI tools, executed over an `embedded-shell` `LinuxShell`."
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Build docs.rs with all features so feature-gated modules show up.
[package.metadata.docs.rs]
all-features = true

[dependencies]
embedded-shell = { path = "../embedded-shell" }
regex.workspace = true
thiserror.workspace = true

# Optional, gated by features below.
base64 = { version = "0.22", optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
embedded-shell = { path = "../embedded-shell", features = ["test-utils"] }
tokio = { workspace = true, features = ["test-util"] }
tracing.workspace = true
tracing-subscriber.workspace = true
serial_test.workspace = true

[features]
default = ["coreutils", "iputils"]

# Grouped by the system package that provides the wrapped tools.
# Default-on: universal on any embedded Linux (busybox or GNU).
coreutils = ["dep:base64"]   # ls, cat, chmod, mkdir, rm, sha256sum, …
                             # base64 is needed by fs::write for the
                             # host-side encoding before shipping to
                             # the device's `base64 -d`.
iputils   = []   # ping, arping

# Opt-in: present on some distros but not universal in embedded.
systemd        = ["dep:serde", "dep:serde_json"]
                       # systemctl, journalctl, loginctl
                       # Common on Yocto-with-systemd and Debian-based;
                       # absent on OpenWrt, busybox-init Buildroot, etc.
                       # journalctl parsing uses `-o json` → needs serde.
networkmanager = []   # nmcli (terse-format parsing, no extra deps)
modemmanager   = ["dep:serde", "dep:serde_json"]   # mmcli (parses `-J` JSON output)
iproute2       = ["dep:serde", "dep:serde_json"]   # ip, ss, route (parses `ip -j` JSON)
