[workspace]
resolver = "3"
members = [
    "crates/embedded-shell",
    "crates/embedded-shell-linux",
    "crates/embedded-shell-transfer",
    "crates/eshell",
]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "sync", "time", "fs"] }
tokio-serial = "5"
tracing = "0.1"

# Dev-only / test-only
serial_test = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
