version: 2

updates:
  # Rust dependencies across the workspace. Cargo.toml + Cargo.lock are
  # at the workspace root, so a single entry covers every member crate.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - rust
    commit-message:
      prefix: deps
      include: scope
    # Roll up routine bumps so we don't drown in one-PR-per-dep noise.
    # Anything outside this group (i.e. major version bumps) still gets
    # its own PR for individual review.
    groups:
      cargo-patch-and-minor:
        update-types:
          - patch
          - minor

  # GitHub Actions workflow steps (actions/checkout, rust-toolchain,
  # rust-cache, …). These move infrequently so once a week is plenty.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
