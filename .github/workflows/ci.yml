name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Cancel in-progress runs on the same branch/PR when a new push lands —
# saves CI minutes on rapid push sequences.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build, test, lint, doc
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      # tokio-serial → serialport-rs links against libudev on Linux.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libudev-dev pkg-config

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo build (workspace, all features, all targets)
        run: cargo build --workspace --all-features --all-targets

      # Hardware tests are #[ignore]d so `cargo test` won't run them.
      # The `--all-features` flag enables `test-utils` which makes the
      # `hardware_*` binaries *compile*, so a compile error there fails
      # CI even though the test bodies don't execute against a device.
      - name: cargo test (workspace, all features)
        run: cargo test --workspace --all-features

      - name: cargo clippy (-D warnings)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo doc (RUSTDOCFLAGS=-D warnings)
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
